<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 720" width="740" height="720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="analystGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#163354"/>
    </linearGradient>
    <linearGradient id="huntGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0f2a1c"/>
    </linearGradient>
    <linearGradient id="chainsawGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1c0f2a"/>
    </linearGradient>
    <linearGradient id="webhookGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a0a"/>
      <stop offset="100%" stop-color="#2a1c00"/>
    </linearGradient>
    <linearGradient id="analysisGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#163354"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="720" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="370" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="1">ChainsawMCP — Workflow</text>
  <line x1="120" y1="50" x2="620" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- ── Step 1: Analyst Prompt ── -->
  <rect x="40" y="68" width="660" height="82" rx="10" fill="url(#analystGrad)" stroke="#4a9eff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="68" width="6" height="82" rx="3" fill="#4a9eff"/>
  <text x="68" y="94" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1.5">ANALYST PROMPT</text>
  <text x="68" y="116" fill="#e2e8f0" font-size="14" font-weight="500">"Run a hunt on F:\ChainsawEvals"</text>
  <text x="68" y="138" fill="#64748b" font-size="12">Claude Desktop · OpenWebUI · Any MCP-compatible client</text>

  <!-- Arrow 1 -->
  <line x1="370" y1="152" x2="370" y2="174" stroke="#4a9eff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ── Step 2: start_hunt ── -->
  <rect x="40" y="178" width="660" height="90" rx="10" fill="url(#huntGrad)" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="178" width="6" height="90" rx="3" fill="#4ade80"/>
  <text x="68" y="204" fill="#86efac" font-size="11" font-weight="600" letter-spacing="1.5">MCP TOOL — start_hunt</text>
  <text x="68" y="226" fill="#e2e8f0" font-size="14" font-weight="500">Prepares evidence · Spawns detached runner · Returns in &lt; 1 second</text>
  <!-- Badge -->
  <rect x="500" y="216" width="178" height="26" rx="13" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
  <text x="589" y="234" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">✓ MCP session stays free</text>
  <text x="68" y="254" fill="#64748b" font-size="12">Job ID written to disk · Runner PID returned · --skip-errors enabled</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="270" x2="370" y2="292" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ── Step 3: Chainsaw (detached) ── -->
  <rect x="40" y="296" width="660" height="90" rx="10" fill="url(#chainsawGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="296" width="6" height="90" rx="3" fill="#a78bfa"/>
  <text x="68" y="322" fill="#c4b5fd" font-size="11" font-weight="600" letter-spacing="1.5">CHAINSAW — DETACHED PROCESS</text>
  <text x="68" y="344" fill="#e2e8f0" font-size="14" font-weight="500">Hunts EVTXs against Sigma + Chainsaw rules · Writes JSON results to disk</text>
  <!-- Badge -->
  <rect x="460" y="334" width="218" height="26" rx="13" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="569" y="352" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">Independent of MCP session</text>
  <text x="68" y="372" fill="#64748b" font-size="12">Minutes to hours · Survives session close · Results persist across restarts</text>

  <!-- Arrow 3 -->
  <line x1="370" y1="388" x2="370" y2="410" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ── Step 4: Webhook ── -->
  <rect x="40" y="414" width="660" height="90" rx="10" fill="url(#webhookGrad)" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="414" width="6" height="90" rx="3" fill="#fb923c"/>
  <text x="68" y="440" fill="#fdba74" font-size="11" font-weight="600" letter-spacing="1.5">WEBHOOK NOTIFICATION</text>
  <text x="68" y="462" fill="#e2e8f0" font-size="14" font-weight="500">Hunt complete · Hits and rule count delivered to your channel</text>
  <!-- Badges -->
  <rect x="68" y="473" width="82" height="22" rx="11" fill="#431407" stroke="#fb923c" stroke-width="1"/>
  <text x="109" y="489" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">Discord</text>
  <rect x="162" y="473" width="62" height="22" rx="11" fill="#431407" stroke="#fb923c" stroke-width="1"/>
  <text x="193" y="489" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">Slack</text>
  <rect x="236" y="473" width="120" height="22" rx="11" fill="#431407" stroke="#fb923c" stroke-width="1"/>
  <text x="296" y="489" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">Any HTTP endpoint</text>

  <!-- Arrow 4 -->
  <line x1="370" y1="506" x2="370" y2="528" stroke="#4a9eff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ── Step 5: Analysis ── -->
  <rect x="40" y="532" width="660" height="148" rx="10" fill="url(#analysisGrad)" stroke="#4a9eff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="532" width="6" height="148" rx="3" fill="#4a9eff"/>
  <text x="68" y="558" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1.5">INTERACTIVE ANALYSIS</text>

  <!-- Tool pills -->
  <rect x="68" y="568" width="148" height="32" rx="8" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.2"/>
  <text x="142" y="584" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">load_hunt_results</text>
  <text x="142" y="596" text-anchor="middle" fill="#475569" font-size="10">loads pre-computed hits</text>

  <rect x="232" y="568" width="148" height="32" rx="8" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.2"/>
  <text x="306" y="584" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">chainsaw_report</text>
  <text x="306" y="596" text-anchor="middle" fill="#475569" font-size="10">severity breakdown</text>

  <rect x="396" y="568" width="148" height="32" rx="8" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.2"/>
  <text x="470" y="584" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">get_detections</text>
  <text x="470" y="596" text-anchor="middle" fill="#475569" font-size="10">filter by rule / severity</text>

  <rect x="560" y="568" width="118" height="32" rx="8" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.2"/>
  <text x="619" y="584" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">Follow-up Q&amp;A</text>
  <text x="619" y="596" text-anchor="middle" fill="#475569" font-size="10">unlimited depth</text>

  <!-- Arrows between analysis pills -->
  <line x1="218" y1="584" x2="230" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="382" y1="584" x2="394" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="546" y1="584" x2="558" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <line x1="68" y1="616" x2="660" y2="616" stroke="#1e293b" stroke-width="1"/>
  <text x="68" y="638" fill="#e2e8f0" font-size="13" font-weight="500">"Show me critical events"  ·  "Does this suggest lateral movement?"</text>
  <text x="68" y="660" fill="#e2e8f0" font-size="13" font-weight="500">"Correlate logon times across endpoints"  ·  "Draft an exec summary"</text>

  <!-- Footer -->
  <text x="370" y="698" text-anchor="middle" fill="#334155" font-size="11">No server-side LLM calls · Works with Claude, OpenWebUI, LM Studio, and any MCP-compatible client</text>
</svg>
