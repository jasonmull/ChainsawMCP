[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainsaw-mcp"
version = "0.1.0"
description = "MCP server wrapping Chainsaw for Windows Event Log analysis with LLM enrichment"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[project.scripts]
chainsaw-mcp = "chainsaw_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chainsaw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
